[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pcn-torch"
dynamic = ["version"]
description = "Predictive Coding Networks in PyTorch"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Enrique Mendez" },
]
dependencies = [
    "numpy>=2.2.6",
    "rich>=14.0",
]
# torch is a peer dependency — install from https://pytorch.org
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
keywords = [
    "predictive coding",
    "neural networks",
    "pytorch",
    "machine learning",
    "deep learning",
    "biologically plausible",
]

[project.urls]
Homepage = "https://github.com/emv-dev/pcn-torch"
Repository = "https://github.com/emv-dev/pcn-torch"
"Bug Tracker" = "https://github.com/emv-dev/pcn-torch/issues"
Paper = "https://arxiv.org/abs/2506.06332"

[dependency-groups]
dev = [
    "ruff>=0.15",
    "mypy>=1.19",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "torchvision>=0.15",  # required for examples/cifar10.py only
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"

[tool.hatch.build.hooks.vcs]
version-file = "src/pcn_torch/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pcn_torch"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]

[tool.ruff.lint.isort]
known-first-party = ["pcn_torch"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "torch.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source_pkgs = ["pcn_torch"]
branch = true
